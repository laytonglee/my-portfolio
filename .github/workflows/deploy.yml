name: Deploy React Portfolio to VPS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portfolio
        run: npm run build

      - name: Compress build
        run: tar -czf portfolio-dist.tar.gz -C dist .

      - name: Copy build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.VPS_PORT }}
          source: portfolio-dist.tar.gz
          target: /home/${{ secrets.VPS_USER }}/apps/portfolio

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e

            APP_DIR="/home/ubuntu/apps/portfolio"

            rm -rf "$APP_DIR/dist"
            mkdir -p "$APP_DIR/dist"

            tar -xzf "$APP_DIR/portfolio-dist.tar.gz" -C "$APP_DIR/dist"

            rm -f "$APP_DIR/portfolio-dist.tar.gz"

            docker exec nginx_proxy nginx -s reload

            echo "Portfolio deployed successfully."
